[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "golf-performance-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.setuptools]
py-modules = ["main", "schemas", "analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
